plugins {
    id 'com.android.application'
}

android {
    namespace 'com.medsuite.pharmacy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.medsuite.pharmacy'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity support (same library PWABuilder emits).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
