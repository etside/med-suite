name: Build & Deploy Medsuite-eT

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api/index.php
          VITE_APP_URL: https://med-suite.shop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-netlify:
    name: Deploy to Netlify
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'netlify'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-cpanel-ftp:
    name: Deploy to cPanel via FTP
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'cpanel-ftp'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}

  seed-sql:
    name: Generate Seeded Schema SQL
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate password hashes and seed SQL
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          SUPER_ADMIN_PASS: ${{ secrets.SUPER_ADMIN_PASS }}
        run: |
          php -r "
          \$adminHash = password_hash(getenv('ADMIN_PASS'), PASSWORD_BCRYPT, ['cost' => 12]);
          \$superHash = password_hash(getenv('SUPER_ADMIN_PASS'), PASSWORD_BCRYPT, ['cost' => 12]);
          \$sql = file_get_contents('cpanel-schema.sql');
          \$sql = str_replace('%%ADMIN_PASS_HASH%%', \$adminHash, \$sql);
          \$sql = str_replace('%%SUPER_ADMIN_PASS_HASH%%', \$superHash, \$sql);
          file_put_contents('cpanel-schema-seeded.sql', \$sql);
          echo \"Seeded SQL generated.\n\";
          "

      - name: Upload seeded schema
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-cpanel-schema
          path: cpanel-schema-seeded.sql
          retention-days: 7

  create-zip:
    name: Create Deployment ZIP (cPanel)
    needs: [build, seed-sql]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for PHP backend files)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download seeded schema SQL
        uses: actions/download-artifact@v4
        with:
          name: medsuite-cpanel-schema
          path: seeded-schema/

      - name: Copy config.kp.php into ZIP
        run: |
          mkdir -p dist/api
          # config.kp.php contains real credentials — rename to config.php after upload
          cp public/api/config.kp.php dist/api/config.kp.php
          # Placeholder config.php so the file exists (rename config.kp.php → config.php on server)
          cp public/api/config.example.php dist/api/config.php

      - name: Copy PHP API backend into dist/api/
        run: |
          mkdir -p dist/api
          cp -r public/api/inc         dist/api/
          cp -r public/api/migrations  dist/api/
          cp    public/api/index.php          dist/api/
          cp    public/api/pg-api.php         dist/api/
          cp    public/api/seed-admin.php     dist/api/
          cp    public/api/seed-products.php  dist/api/
          cp    public/api/import-products-cli.php dist/api/
          cp    public/api/schema.sql         dist/api/
          # NOTE: config.php was generated above — do NOT overwrite it

          # Copy dotfiles that Vite skips (it doesn't copy .htaccess from public/)
          cp public/.htaccess dist/.htaccess

      - name: Copy seeded schema SQL into dist/
        run: cp seeded-schema/cpanel-schema-seeded.sql dist/cpanel-schema-seeded.sql

      - name: Verify critical files exist
        run: |
          echo "=== dist/ top-level ==="
          ls -la dist/
          echo "=== dist/api/ ==="
          ls -la dist/api/
          echo "--- .htaccess present: $(test -f dist/.htaccess && echo YES || echo MISSING) ---"
          echo "--- config.php present: $(test -f dist/api/config.php && echo YES || echo MISSING) ---"
          echo "--- index.html present: $(test -f dist/index.html && echo YES || echo MISSING) ---"
          echo "--- api/index.php present: $(test -f dist/api/index.php && echo YES || echo MISSING) ---"
          # Verify config.php is valid PHP and shows correct DB name (no secret values)
          php -r "
          \$c = require 'dist/api/config.php';
          echo 'db_host: ' . \$c['db_host'] . PHP_EOL;
          echo 'db_name: ' . \$c['db_name'] . PHP_EOL;
          echo 'db_user: ' . \$c['db_user'] . PHP_EOL;
          echo 'db_pass: [REDACTED]' . PHP_EOL;
          echo 'jwt_secret: [REDACTED]' . PHP_EOL;
          "
          # Fail the step if any critical file is missing
          test -f dist/.htaccess   || (echo "ERROR: .htaccess missing!" && exit 1)
          test -f dist/index.html  || (echo "ERROR: index.html missing!" && exit 1)
          test -f dist/api/config.php  || (echo "ERROR: config.php missing!" && exit 1)
          test -f dist/api/index.php   || (echo "ERROR: api/index.php missing!" && exit 1)
          echo "All critical files present."

      - name: Create ZIP for cPanel File Manager upload
        run: cd dist && zip -r ../medsuite-deploy.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-deploy
          path: medsuite-deploy.zip
          retention-days: 7
