name: Build & Deploy Medsuite-eT

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api/index.php
          VITE_APP_URL: https://med-suite.shop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-netlify:
    name: Deploy to Netlify
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'netlify'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-cpanel-ftp:
    name: Deploy to cPanel via FTP
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'cpanel-ftp'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}

  seed-sql:
    name: Generate Seeded Schema SQL
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate password hashes and seed SQL
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          SUPER_ADMIN_PASS: ${{ secrets.SUPER_ADMIN_PASS }}
        run: |
          php -r "
          \$adminHash = password_hash(getenv('ADMIN_PASS'), PASSWORD_BCRYPT, ['cost' => 12]);
          \$superHash = password_hash(getenv('SUPER_ADMIN_PASS'), PASSWORD_BCRYPT, ['cost' => 12]);
          \$sql = file_get_contents('cpanel-schema.sql');
          \$sql = str_replace('%%ADMIN_PASS_HASH%%', \$adminHash, \$sql);
          \$sql = str_replace('%%SUPER_ADMIN_PASS_HASH%%', \$superHash, \$sql);
          file_put_contents('cpanel-schema-seeded.sql', \$sql);
          echo \"Seeded SQL generated.\n\";
          "

      - name: Upload seeded schema
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-cpanel-schema
          path: cpanel-schema-seeded.sql
          retention-days: 7

  create-zip:
    name: Create Deployment ZIP (cPanel)
    needs: [build, seed-sql]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for PHP backend files)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download seeded schema SQL
        uses: actions/download-artifact@v4
        with:
          name: medsuite-cpanel-schema
          path: seeded-schema/

      - name: Generate config.php from GitHub secrets
        run: |
          mkdir -p dist/api
          # Generate config.php from GitHub secrets (never commit real credentials to git)
          cat > dist/api/config.php <<'PHPEOF'
          <?php
          return [
              'db_host'    => getenv('DB_HOST') ?: 'localhost',
              'db_port'    => getenv('DB_PORT') ?: '3306',
              'db_name'    => getenv('DB_NAME') ?: '',
              'db_user'    => getenv('DB_USER') ?: '',
              'db_pass'    => getenv('DB_PASS') ?: '',
              'jwt_secret' => getenv('JWT_SECRET') ?: 'change-me-in-production',
          ];
          PHPEOF
          php -r '$c = require "dist/api/config.php"; echo "config.php valid — db_name: " . $c["db_name"] . PHP_EOL;'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Copy PHP API backend into dist/api/
        run: |
          mkdir -p dist/api
          cp -r public/api/inc         dist/api/
          cp -r public/api/migrations  dist/api/
          cp    public/api/index.php          dist/api/
          cp    public/api/pg-api.php         dist/api/
          cp    public/api/seed-admin.php     dist/api/
          cp    public/api/seed-products.php  dist/api/
          cp    public/api/import-products-cli.php dist/api/
          cp    public/api/schema.sql         dist/api/
          # NOTE: config.php was generated above — do NOT overwrite it

          # Copy dotfiles that Vite skips (it doesn't copy .htaccess from public/)
          cp public/.htaccess dist/.htaccess

      - name: Copy seeded schema SQL into dist/
        run: cp seeded-schema/cpanel-schema-seeded.sql dist/cpanel-schema-seeded.sql

      - name: Verify critical files exist
        run: |
          echo "=== dist/ top-level ==="
          ls -la dist/
          echo "=== dist/api/ ==="
          ls -la dist/api/
          echo "--- .htaccess present: $(test -f dist/.htaccess && echo YES || echo MISSING) ---"
          echo "--- config.php present: $(test -f dist/api/config.php && echo YES || echo MISSING) ---"
          echo "--- index.html present: $(test -f dist/index.html && echo YES || echo MISSING) ---"
          echo "--- api/index.php present: $(test -f dist/api/index.php && echo YES || echo MISSING) ---"
          # Verify config.php is valid PHP and shows correct DB name (no secret values)
          php -r "
          \$c = require 'dist/api/config.php';
          echo 'db_host: ' . \$c['db_host'] . PHP_EOL;
          echo 'db_name: ' . \$c['db_name'] . PHP_EOL;
          echo 'db_user: ' . \$c['db_user'] . PHP_EOL;
          echo 'db_pass: [REDACTED]' . PHP_EOL;
          echo 'jwt_secret: [REDACTED]' . PHP_EOL;
          "
          # Fail the step if any critical file is missing
          test -f dist/.htaccess   || (echo "ERROR: .htaccess missing!" && exit 1)
          test -f dist/index.html  || (echo "ERROR: index.html missing!" && exit 1)
          test -f dist/api/config.php  || (echo "ERROR: config.php missing!" && exit 1)
          test -f dist/api/index.php   || (echo "ERROR: api/index.php missing!" && exit 1)
          echo "All critical files present."

      - name: Create ZIP for cPanel File Manager upload
        run: cd dist && zip -r ../medsuite-deploy.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-deploy
          path: medsuite-deploy.zip
          retention-days: 7

  deploy-vps:
    name: Deploy to VPS (med-suite.shop)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for PHP backend files)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Overlay PHP API backend into dist/api/
        run: |
          mkdir -p dist/api
          cp -r public/api/inc         dist/api/
          cp -r public/api/migrations  dist/api/
          cp    public/api/index.php          dist/api/
          cp    public/api/seed-admin.php     dist/api/
          cp    public/api/seed-products.php  dist/api/
          cp    public/api/import-products-cli.php dist/api/
          cp    public/api/schema.sql         dist/api/
          cp    public/api/schema-sqlite.sql  dist/api/
          # NOTE: config.php lives on the server (SQLite path + JWT secret)
          # and must NEVER be overwritten by a deploy.
          php -l dist/api/index.php
          test -f dist/index.html || (echo "ERROR: index.html missing!" && exit 1)
          test -f dist/api/index.php || (echo "ERROR: api/index.php missing!" && exit 1)
          echo "VPS payload ready."

      - name: Install rsync on runner
        run: sudo apt-get update -qq && sudo apt-get install -qy rsync

      - name: Push to VPS over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            --exclude 'api/config.php' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          rm -f ~/.ssh/deploy_key

      - name: Fix permissions on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_PATH/uploads/products' /var/www/med-data && chown -R www-data:www-data '$VPS_PATH' /var/www/med-data && chmod 755 /var/www/med-data"
          rm -f ~/.ssh/deploy_key

      - name: Verify live health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://$VPS_HOST/api/index.php?action=health" || true)
            echo "health check $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "ERROR: API health check failed"
          exit 1
