name: Build & Deploy Medsuite-eT

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api/index.php

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-netlify:
    name: Deploy to Netlify
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.target == 'netlify'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-cpanel-ftp:
    name: Deploy to cPanel via FTP
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'cpanel'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Copy .htaccess to dist
        run: |
          cat > dist/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>

          <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set X-Frame-Options "SAMEORIGIN"
            Header set X-XSS-Protection "1; mode=block"
            Header set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>

          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
          </IfModule>
          EOF

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}

  seed-sql:
    name: Generate Seeded Schema SQL
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate password hashes and seed SQL
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          SUPER_ADMIN_PASS: ${{ secrets.SUPER_ADMIN_PASS }}
        run: |
          php -r "
          \$adminHash = password_hash(getenv('ADMIN_PASS'), PASSWORD_BCRYPT, ['cost' => 12]);
          \$superHash = password_hash(getenv('SUPER_ADMIN_PASS'), PASSWORD_BCRYPT, ['cost' => 12]);
          \$sql = file_get_contents('cpanel-schema.sql');
          \$sql = str_replace('%%ADMIN_PASS_HASH%%', \$adminHash, \$sql);
          \$sql = str_replace('%%SUPER_ADMIN_PASS_HASH%%', \$superHash, \$sql);
          file_put_contents('cpanel-schema-seeded.sql', \$sql);
          echo \"Seeded SQL generated.\\n\";
          "

      - name: Upload seeded schema
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-cpanel-schema
          path: cpanel-schema-seeded.sql
          retention-days: 7

  create-zip:
    name: Create Deployment ZIP (cPanel)
    needs: [build, seed-sql]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for PHP backend files)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download seeded schema SQL
        uses: actions/download-artifact@v4
        with:
          name: medsuite-cpanel-schema
          path: seeded-schema/

      - name: Generate config.php from secrets
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          mkdir -p dist/api
          cat > dist/api/config.php << PHPEOF
          <?php
          return [
              'db_host'    => 'localhost',
              'db_port'    => '3306',
              'db_name'    => '${DB_NAME}',
              'db_user'    => '${DB_USER}',
              'db_pass'    => '${DB_PASS}',
              'jwt_secret' => '${JWT_SECRET}',
          ];
          PHPEOF

      - name: Copy PHP API backend into dist/api/
        run: |
          mkdir -p dist/api
          cp -r public/api/inc  dist/api/
          cp -r public/api/migrations dist/api/
          cp    public/api/index.php          dist/api/
          cp    public/api/pg-api.php         dist/api/
          cp    public/api/seed-admin.php     dist/api/
          cp    public/api/seed-products.php  dist/api/
          cp    public/api/import-products-cli.php dist/api/
          cp    public/api/schema.sql         dist/api/
          # config.php was generated above — do not overwrite

      - name: Copy seeded schema SQL into dist/
        run: cp seeded-schema/cpanel-schema-seeded.sql dist/cpanel-schema-seeded.sql

      - name: Create ZIP for cPanel File Manager upload
        run: cd dist && zip -r ../medsuite-deploy.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-deploy
          path: medsuite-deploy.zip
          retention-days: 7
