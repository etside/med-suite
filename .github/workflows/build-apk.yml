name: Build Android APK (PWA)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build web app (VPS API over HTTP until HTTPS domain is live)
        run: npm run build
        env:
          VITE_API_URL: http://89.125.10.47/api/index.php
          VITE_APP_URL: http://89.125.10.47

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          # Allow plain-HTTP API until https://med-suite.shop goes live.
          # Remove this sed once the app talks HTTPS only.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' "$MANIFEST" || \
            sed -i 's|<application |<application android:usesCleartextTraffic="true" |' "$MANIFEST"
          grep -n 'usesCleartextTraffic' "$MANIFEST" || true

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk medsuite-et-debug.apk
          ls -la medsuite-et-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-android-apk
          path: medsuite-et-debug.apk
          retention-days: 30

  release-apk:
    name: Attach APK to Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: medsuite-android-apk
          path: release/

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          fail_on_unmatched_files: true
