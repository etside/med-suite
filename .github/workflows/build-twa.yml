name: Build Android TWA APK (PWA)

# Minimal PWABuilder-style wrapper: Trusted Web Activity opening
# https://med-suite.shop/ fullscreen. No SDK code, no bundled web app.
# Until DNS + assetlinks are live it opens as a Custom Tab (URL bar);
# after verification it runs fullscreen borderless.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL the APK opens (use http://89.125.10.47/ until DNS is live)'
        default: 'https://med-suite.shop/'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build-twa:
    name: Build TWA APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set site URL
        run: |
          URL="${{ inputs.site_url }}"
          [ -z "$URL" ] && URL="https://med-suite.shop/"
          sed -i "s|android:value=\"[^\"]*\"|android:value=\"$URL\"|" twa/app/src/main/AndroidManifest.xml
          grep -n 'DEFAULT_URL' -A1 twa/app/src/main/AndroidManifest.xml | head -n 4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2
          build-root-directory: twa
          arguments: assembleDebug --no-daemon

      - name: Rename APK
        run: cp twa/app/build/outputs/apk/debug/app-debug.apk medsuite-et-twa-debug.apk && ls -la medsuite-et-twa-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-twa-apk
          path: medsuite-et-twa-debug.apk
          retention-days: 30

  release-twa:
    name: Attach TWA APK to Release
    needs: build-twa
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: medsuite-twa-apk
          path: release/

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          fail_on_unmatched_files: true
