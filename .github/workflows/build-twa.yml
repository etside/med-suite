name: Build Android TWA APK (PWA)

# Minimal PWABuilder-style wrapper: Trusted Web Activity opening
# https://med-suite.shop/ fullscreen. No SDK code, no bundled web app.
# Until DNS + assetlinks are live it opens as a Custom Tab (URL bar);
# after verification it runs fullscreen borderless.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL the APK opens (use http://89.125.10.47/ until DNS is live)'
        default: 'https://med-suite.shop/'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build-twa:
    name: Build TWA APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set site URL
        run: |
          URL="${{ inputs.site_url }}"
          [ -z "$URL" ] && URL="https://med-suite.shop/"
          sed -i "s|android:value=\"[^\"]*\"|android:value=\"$URL\"|" twa/app/src/main/AndroidManifest.xml
          grep -n 'DEFAULT_URL' -A1 twa/app/src/main/AndroidManifest.xml | head -n 4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2
          build-root-directory: twa
          arguments: assembleDebug --no-daemon

      - name: Rename APK
        run: cp twa/app/build/outputs/apk/debug/app-debug.apk medsuite-et-twa-debug.apk && ls -la medsuite-et-twa-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-twa-apk
          path: medsuite-et-twa-debug.apk
          retention-days: 30

      - name: Prepare release keystore (saved secret or fresh)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "path=$RUNNER_TEMP/release.keystore"
              echo "storepass=$KEYSTORE_PASSWORD"
              echo "alias=$KEY_ALIAS"
              echo "keypass=$KEY_PASSWORD"
              echo "fresh=false"
            } >> "$GITHUB_OUTPUT"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -alias medsuite -keyalg RSA -keysize 2048 -validity 10950 -storepass "$PASS" -keypass "$PASS" -dname "CN=Medsuite-eT, OU=engineersTech, O=engineersTech, L=Dhaka, C=BD"
            base64 -w0 "$RUNNER_TEMP/release.keystore" > "$RUNNER_TEMP/keystore.b64"
            {
              echo "path=$RUNNER_TEMP/release.keystore"
              echo "storepass=$PASS"
              echo "alias=medsuite"
              echo "keypass=$PASS"
              echo "fresh=true"
            } >> "$GITHUB_OUTPUT"
          fi
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$(grep '^storepass=' "$GITHUB_OUTPUT" | cut -d= -f2)" 2>/dev/null | grep -E 'SHA256|Alias name' || true

      - name: Build signed release (APK + AAB)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2
          build-root-directory: twa
          arguments: assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.storepass }}
          KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.keypass }}

      - name: Collect release files
        run: |
          cp twa/app/build/outputs/apk/release/app-release.apk medsuite-et-release.apk
          cp twa/app/build/outputs/bundle/release/app-release.aab medsuite-et-release.aab
          ls -la medsuite-et-release.*
          if [ "${{ steps.keystore.outputs.fresh }}" = "true" ]; then
            cp "$RUNNER_TEMP/keystore.b64" new-keystore.b64
            echo "${{ steps.keystore.outputs.storepass }}" > keystore-password.txt
            echo "SAVE AS REPO SECRETS (one-time): ANDROID_KEYSTORE_B64 + PASSWORDS (see keystore-password.txt, alias medsuite)"
          fi

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: medsuite-twa-release
          path: |
            medsuite-et-release.apk
            medsuite-et-release.aab
            new-keystore.b64
            keystore-password.txt
          retention-days: 30
          if-no-files-found: warn

  release-twa:
    name: Attach TWA APK to Release
    needs: build-twa
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: medsuite-twa-*
          path: release/
          merge-multiple: true

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/*.aab
          fail_on_unmatched_files: true
